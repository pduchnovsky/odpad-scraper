name: Update waste calendar

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        env:
          ODPAD_URL: ${{ vars.ODPAD_URL }}
          ODPAD_OUTPUT: ${{ github.workspace }}/odvoz-odpadu.ics
        run: python scrape_odpad.py

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add odvoz-odpadu.ics
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update waste calendar"
            git push
          fi
