name: Generate and publish container image

on:
  push:
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - "index.html"
      - "scrape_odpad.py"
      - ".github/workflows/generate-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/odpad-scraper:latest
            ghcr.io/${{ github.repository_owner }}/odpad-scraper:${{ github.sha }}
